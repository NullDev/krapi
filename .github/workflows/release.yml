name: release

# publishes the package to npm when a version tag is pushed (v0.1.0): no token, npm trusts this workflow through OIDC
# and attaches provenance. the tag must match the version in package.json, and prepublishOnly runs lint, typecheck,
# the tests and the build before anything is uploaded

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5 or newer
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: the tag names the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm publish --provenance --access public
